name: Cross-browser check (temporary diagnostic)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox webkit

      - name: Write diagnostic script and fixtures
        run: |
          mkdir -p /tmp/fixture
          cat > /tmp/fixture/app.properties <<'FIXEOF'
          password = fake-CrossBrowserSecret123
          FIXEOF
          cat > /tmp/fixture/notes.txt <<'FIXEOF'
          not a classified extension, should be copied through
          FIXEOF
          cat > /tmp/cross_browser_check.py <<'PYEOF'
          import asyncio
          import http.server
          import functools
          import threading
          import sys
          import os
          import zipfile
          from playwright.async_api import async_playwright

          SITE_ROOT = os.environ["GITHUB_WORKSPACE"]
          PORT = 8831


          def serve():
              handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=SITE_ROOT)
              http.server.ThreadingHTTPServer(("0.0.0.0", PORT), handler).serve_forever()


          # Each step below runs this for exactly one browser and exits
          # non-zero on failure, so pass/fail per browser (and per stage,
          # since we print which stage we reached before exiting) shows up
          # as that step's own conclusion via the Actions API - this repo's
          # API access can read run/job/step conclusions without auth, but
          # not raw log content, so the stage reached is encoded as an exit
          # code instead of relying on log text:
          #   exit 0  = full PASS
          #   exit 10 = page failed to load / dropZone never appeared
          #   exit 11 = fsAccessArea visible despite no showDirectoryPicker
          #   exit 12 = folder-filter tree or scan flow never reached results
          #   exit 13 = reached results but redaction count/result rows were 0
          #   exit 14 = downloaded zip still contains the real secret value
          #   exit 15 = a page error or console error was raised
          #   exit 1  = browser failed to launch at all

          async def check_browser(name):
              page_errors = []
              console_errors = []

              async with async_playwright() as p:
                  launcher = getattr(p, name)
                  try:
                      browser = await launcher.launch()
                  except Exception as e:
                      print(f"{name}: COULD NOT LAUNCH -", repr(e))
                      sys.exit(1)

                  page = await browser.new_page(viewport={"width": 1280, "height": 900}, accept_downloads=True)
                  page.on("pageerror", lambda e: page_errors.append(str(e)))
                  page.on("console", lambda m: console_errors.append(m.text) if m.type == "error" else None)

                  await page.goto(f"http://127.0.0.1:{PORT}/scanner/index.html")
                  try:
                      await page.wait_for_selector("#dropZone", state="attached", timeout=10000)
                  except Exception as e:
                      print("page failed to load:", repr(e))
                      sys.exit(10)
                  print("page loaded")

                  fs_access_supported = await page.evaluate("() => typeof window.showDirectoryPicker === 'function'")
                  print("showDirectoryPicker supported:", fs_access_supported)
                  if not fs_access_supported:
                      fs_area_hidden = await page.evaluate(
                          "() => { const el = document.getElementById('fsAccessArea'); return !el || el.classList.contains('hidden'); }"
                      )
                      print("fsAccessArea correctly hidden when unsupported:", fs_area_hidden)
                      if not fs_area_hidden:
                          print("FAIL: fsAccessArea visible despite showDirectoryPicker unsupported")
                          sys.exit(11)

                  fixture_dir = "/tmp/fixture"
                  await page.set_input_files("#folderInput", fixture_dir)

                  try:
                      await page.wait_for_selector("#folderTreeState:not(.hidden)", timeout=10000)
                      print("folder-filter tree appeared")
                      tree_rows = await page.locator(".tree-row").count()
                      print("tree rows:", tree_rows)

                      await page.click("#scanSelectedBtn")
                      await page.wait_for_selector("#resultsState:not(.hidden)", timeout=10000)
                      print("results state appeared")
                  except Exception as e:
                      print("FLOW ERROR reaching results:", repr(e))
                      sys.exit(12)

                  redaction_count = await page.text_content("#redactionCount")
                  files_scanned = await page.text_content("#filesScannedCount")
                  print("files scanned:", files_scanned, "/ redactions:", redaction_count)
                  result_rows = await page.locator(".result-row").count()
                  print("result rows:", result_rows)
                  if int(redaction_count or "0") < 1 or result_rows < 1:
                      print("FAIL: no redactions / no result rows")
                      sys.exit(13)

                  try:
                      await page.click("#generateBtn")
                      await page.wait_for_selector("#downloadGeneratedBtn:not(.hidden)", timeout=10000)
                      async with page.expect_download() as dl_info:
                          await page.click("#downloadGeneratedBtn")
                      download = await dl_info.value
                      zip_path = f"/tmp/{name}-download.zip"
                      await download.save_as(zip_path)
                      with zipfile.ZipFile(zip_path) as z:
                          content = z.read("app.properties").decode("utf-8")
                          print("sanitized app.properties content:", content.strip())
                          if "fake-CrossBrowserSecret123" in content:
                              print("FAIL: downloaded zip still contains the real secret value")
                              sys.exit(14)
                  except SystemExit:
                      raise
                  except Exception as e:
                      print("FLOW ERROR during download:", repr(e))
                      sys.exit(12)

                  await browser.close()

                  print("page errors:", page_errors)
                  print("console errors:", console_errors)
                  if page_errors or console_errors:
                      sys.exit(15)

                  print(f"=== {name}: PASS ===")


          threading.Thread(target=serve, daemon=True).start()
          asyncio.run(asyncio.sleep(0.5))
          asyncio.run(check_browser(sys.argv[1]))
          PYEOF

      - name: "Chromium: core flow"
        if: always()
        run: |
          set -o pipefail
          python /tmp/cross_browser_check.py chromium 2>&1 | tee /tmp/out-chromium.txt

      - name: "Firefox: core flow"
        if: always()
        run: |
          set -o pipefail
          python /tmp/cross_browser_check.py firefox 2>&1 | tee /tmp/out-firefox.txt

      - name: "WebKit: core flow"
        if: always()
        run: |
          set -o pipefail
          python /tmp/cross_browser_check.py webkit 2>&1 | tee /tmp/out-webkit.txt

      - name: Publish diagnostic output to a throwaway branch
        if: always()
        run: |
          mkdir -p /tmp/diag
          for b in chromium firefox webkit; do
            echo "=== $b ===" >> /tmp/diag/output.txt
            cat /tmp/out-$b.txt >> /tmp/diag/output.txt 2>/dev/null || echo "(no output captured)" >> /tmp/diag/output.txt
            echo "" >> /tmp/diag/output.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostic-output
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/diag/output.txt .
          git add output.txt
          git commit -m "Diagnostic output for run ${{ github.run_id }}"
          git push --force origin diagnostic-output
